name: Build Windows suite

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read suite version
        id: metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content './App/SimilarVideoFinder.App.csproj'
          "version=$($project.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT
      - name: Build, test and publish standalone EXE
        shell: pwsh
        run: ./build.ps1
      - name: Check standalone launcher
        shell: pwsh
        run: |
          $testData = Join-Path $env:RUNNER_TEMP 'mediaforge-smoke'
          $app = Start-Process -FilePath './dist/MediaForge.exe' -ArgumentList @('--suite-smoke', '--data-dir', "`"$testData`"") -PassThru -WindowStyle Hidden
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw 'Launcher check timed out.' }
          if ($app.ExitCode -ne 0) { Get-Content (Join-Path $testData 'suite-smoke.json'); throw 'Launcher check failed.' }
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash './dist/MediaForge.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MediaForge.exe" | Set-Content './dist/MediaForge.exe.sha256' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MediaForge-windows-x64
          path: |
            dist/MediaForge.exe
            dist/MediaForge.exe.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MediaForge-windows-x64
          path: dist
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v' + $env:SUITE_VERSION }
          gh release create $tag ./dist/MediaForge.exe ./dist/MediaForge.exe.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MediaForge $tag" --generate-notes
